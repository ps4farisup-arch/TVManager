name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.py"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create the Android project
        shell: bash
        run: |
          set -e
          rm -rf android
          mkdir -p "android/."
          cat > "android/.gitignore" <<'TVM_EOF'
          .gradle/
          build/
          app/build/
          local.properties
          .idea/
          *.iml
          TVM_EOF
          mkdir -p "android/app"
          cat > "android/app/build.gradle.kts" <<'TVM_EOF'
          plugins {
              id("com.android.application")
              id("com.chaquo.python")
          }

          android {
              namespace = "sa.tvmanager.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "sa.tvmanager.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 14
                  versionName = "1.4"
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          chaquopy {
              defaultConfig {
                  // لازم يكون Python بنفس الإصدار مثبّت على جهاز البناء (للـ pip فقط)
                  version = "3.11"
                  // على GitHub يُضبط مسار البايثون تلقائياً، وفي Android Studio يدوّر عليه في PATH
                  System.getenv("BUILD_PYTHON")?.let { buildPython(it) }
                  pip {
                      install("paramiko")
                      install("certifi")
                      install("adb-shell")
                      install("rsa")
                      install("pyasn1")
                  }
              }
          }
          TVM_EOF
          mkdir -p "android/app/src/main"
          cat > "android/app/src/main/AndroidManifest.xml" <<'TVM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          TVM_EOF
          mkdir -p "android/app/src/main/java/sa/tvmanager/app"
          cat > "android/app/src/main/java/sa/tvmanager/app/MainActivity.java" <<'TVM_EOF'
          package sa.tvmanager.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.net.wifi.WifiManager;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.chaquo.python.Python;
          import com.chaquo.python.android.AndroidPlatform;

          public class MainActivity extends Activity {
              private static final int FILE_REQUEST = 7;
              private WebView web;
              private WifiManager.MulticastLock multicastLock;
              private ValueCallback<Uri[]> fileCallback;

              private static final String LOADING =
                  "<html dir='rtl'><body style='margin:0;background:#0B1222;color:#F4EFE6;font-family:sans-serif;"
                  + "display:flex;align-items:center;justify-content:center;height:100vh'>"
                  + "<div style='text-align:center'><h2 style='color:#D9B46A'>مدير الشاشات</h2><p>جارٍ التشغيل…</p></div></body></html>";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // بدونها أندرويد يتجاهل ردود البحث الجماعي عن الشاشات (SSDP)
                  WifiManager wifi = (WifiManager) getApplicationContext().getSystemService(WIFI_SERVICE);
                  if (wifi != null) {
                      multicastLock = wifi.createMulticastLock("tvmanager");
                      multicastLock.setReferenceCounted(false);
                      multicastLock.acquire();
                  }

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0B1222"));
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if ("127.0.0.1".equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent i = params.createIntent();
                          if (params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) {
                              i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          }
                          try {
                              startActivityForResult(i, FILE_REQUEST);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.loadDataWithBaseURL(null, LOADING, "text/html", "utf-8", null);

                  new Thread(() -> {
                      try {
                          if (!Python.isStarted()) Python.start(new AndroidPlatform(this));
                          final String url = Python.getInstance().getModule("android_entry").callAttr("start").toString();
                          runOnUiThread(() -> web.loadUrl(url));
                      } catch (Throwable t) {
                          final String msg = String.valueOf(t.getMessage()).replace("<", "&lt;");
                          runOnUiThread(() -> web.loadDataWithBaseURL(null,
                              LOADING.replace("جارٍ التشغيل…", "تعذّر التشغيل:<br><small dir='ltr'>" + msg + "</small>"),
                              "text/html", "utf-8", null));
                      }
                  }).start();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_REQUEST || fileCallback == null) return;
                  Uri[] result = null;
                  if (resultCode == RESULT_OK && data != null) {
                      ClipData clip = data.getClipData();
                      if (clip != null) {
                          result = new Uri[clip.getItemCount()];
                          for (int i = 0; i < clip.getItemCount(); i++) result[i] = clip.getItemAt(i).getUri();
                      } else if (data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      }
                  }
                  fileCallback.onReceiveValue(result);
                  fileCallback = null;
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (multicastLock != null && multicastLock.isHeld()) multicastLock.release();
                  super.onDestroy();
              }
          }
          TVM_EOF
          mkdir -p "android/app/src/main/python"
          cat > "android/app/src/main/python/android_entry.py" <<'TVM_EOF'
          # -*- coding: utf-8 -*-
          """نقطة تشغيل البرنامج داخل تطبيق الأندرويد."""
          import os


          def start():
              os.environ["TVM_ANDROID"] = "1"
              try:
                  import certifi
                  os.environ.setdefault("SSL_CERT_FILE", certifi.where())
              except Exception:
                  pass
              import tv_manager
              return tv_manager.start_background()
          TVM_EOF
          mkdir -p "android/app/src/main/res/drawable"
          cat > "android/app/src/main/res/drawable/ic_launcher_fg.xml" <<'TVM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:strokeColor="#D9B46A" android:strokeWidth="4" android:fillColor="#00000000"
                  android:pathData="M30,36 h48 a4,4 0 0 1 4,4 v28 a4,4 0 0 1 -4,4 h-48 a4,4 0 0 1 -4,-4 v-28 a4,4 0 0 1 4,-4 z" />
              <path android:strokeColor="#D9B46A" android:strokeWidth="4" android:pathData="M44,80 h20 M54,72 v8" />
              <path android:fillColor="#D9B46A"
                  android:pathData="M60,46 a10,10 0 1 0 6,17 a8,8 0 1 1 -6,-17 z" />
          </vector>
          TVM_EOF
          mkdir -p "android/app/src/main/res/drawable"
          cat > "android/app/src/main/res/drawable/ic_launcher_legacy.xml" <<'TVM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="oval"><solid android:color="#0B1222" /></shape></item>
              <item android:drawable="@drawable/ic_launcher_fg" />
          </layer-list>
          TVM_EOF
          mkdir -p "android/app/src/main/res/mipmap-anydpi-v26"
          cat > "android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'TVM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          TVM_EOF
          mkdir -p "android/app/src/main/res/mipmap"
          cat > "android/app/src/main/res/mipmap/ic_launcher.xml" <<'TVM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="oval"><solid android:color="#0B1222" /></shape></item>
              <item android:drawable="@drawable/ic_launcher_fg" />
          </layer-list>
          TVM_EOF
          mkdir -p "android/app/src/main/res/values"
          cat > "android/app/src/main/res/values/strings.xml" <<'TVM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">مدير الشاشات</string>
          </resources>
          TVM_EOF
          mkdir -p "android/app/src/main/res/values"
          cat > "android/app/src/main/res/values/themes.xml" <<'TVM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
              </style>
              <color name="bg">#0B1222</color>
              <color name="gold">#D9B46A</color>
          </resources>
          TVM_EOF
          mkdir -p "android/."
          cat > "android/build.gradle.kts" <<'TVM_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("com.chaquo.python") version "16.0.0" apply false
          }
          TVM_EOF
          mkdir -p "android/."
          cat > "android/gradle.properties" <<'TVM_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          TVM_EOF
          mkdir -p "android/gradle/wrapper"
          cat > "android/gradle/wrapper/gradle-wrapper.properties" <<'TVM_EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          TVM_EOF
          mkdir -p "android/."
          cat > "android/settings.gradle.kts" <<'TVM_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVManager"
          include(":app")
          TVM_EOF
          cp tv_manager.py tv_screen_app.py tv_scenes.py android/app/src/main/python/
          find android -type f | sort

      - name: Build APK
        working-directory: android
        env:
          BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TVManager-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
